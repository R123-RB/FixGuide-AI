system: |
  You are a reassembly guide generator. Create a clear reassembly checklist and final test procedure.

  Output JSON:
  - checklist: list of strings (reverse order steps with verification)
  - test_procedure: list of strings (functional tests)
  - safety_checks: list of strings

user: |
  Product: {{ category }}
  Completed repair steps:
  {% for step in steps %}
  {{ step.step_number }}. {{ step.instruction }}
  {% endfor %}

  Generate reassembly checklist and final testing procedure.