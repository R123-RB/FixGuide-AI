name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run Ruff
        run: uv run ruff check src/ tests/
      - name: Run Ruff format check
        run: uv run ruff format --check src/ tests/
      - name: Run MyPy
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
      - name: Run validation script
        run: uv run python scripts/validate.py

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t fixguide-ai:test .
      - name: Test Docker image starts
        run: |
          docker run -d --name fixguide-test -p 8000:8000 fixguide-ai:test
          sleep 10
          curl -f http://localhost:8000/health/ || exit 1
          docker stop fixguide-test