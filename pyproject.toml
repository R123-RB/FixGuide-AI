[project]
name = "fixguide-ai"
version = "0.1.0"
description = "Multimodal GenAI repair assistant for consumer products"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.10",
    "groq>=0.9",
    "openai>=1.30",
    "anthropic>=0.39",
    "google-generativeai>=0.7",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "langchain-text-splitters>=0.3",
    "numpy>=1.26",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "loguru>=0.7",
    "httpx>=0.27",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
eval = ["ragas>=0.2", "deepeval>=1.0"]
fine-tune = ["unsloth>=2024.1", "peft>=0.11", "trl>=0.9", "accelerate>=0.30"]

[tool.uv.sources]
# fixguide-ai = {path = ".", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixguide"]

[tool.hatch.build.targets.sdist]
include = ["src/fixguide", "config", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "W", "C4", "ANN", "D", "T20", "PTH", "ERA", "SIM", "RET"]
lint.ignore = ["D100", "D104", "ANN101", "ANN102", "S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
mypy_path = "src"