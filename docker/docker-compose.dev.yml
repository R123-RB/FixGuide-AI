services:
  qdrant:
    image: qdrant/qdrant:v1.13.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VECTOR_QDRANT_HOST=qdrant
      - VECTOR_QDRANT_PORT=6333
    env_file:
      - ../.env
    depends_on:
      qdrant:
        condition: service_started
    # Volumes mounted for live reload during development
    # volumes:
    #   - ./src:/app/src
    #   - ./config:/app/config
    command: uv run uvicorn fixguide.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  qdrant_data: